name: psxdata-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    image: mtauha/psxdata-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "4"
      # Only Caddy (fixed address below) may set X-Forwarded-For, so callers cannot spoof their IP.
      FORWARDED_ALLOW_IPS: 172.28.0.2
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging: *default-logging
    networks:
      - edge

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks:
      edge:
        ipv4_address: 172.28.0.2

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Dynamic addresses come from the upper half only, so no container can take Caddy's fixed .2.
          ip_range: 172.28.0.128/25

volumes:
  caddy_data:
  caddy_config:
