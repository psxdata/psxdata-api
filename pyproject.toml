[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psxdata-api"
dynamic = ["version"]
description = "FastAPI REST service for Pakistan Stock Exchange (PSX) data"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
dependencies = [
    "psxdata[socks] @ https://github.com/psxdata/psxdata/archive/refs/tags/v1.3.0.zip",  # TODO: back to ==1.3.0 once on PyPI
    "fastapi[standard]>=0.142.0,<0.143",
    "opentelemetry-sdk>=1.45,<1.46",
    "uvicorn[standard]>=0.23",
    "slowapi>=0.1",
    "redis>=4.5",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-asyncio",
    "fakeredis>=2.20",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.fastapi]
entrypoint = "api.main:app"

[project.urls]
Homepage = "https://github.com/psxdata/psxdata-api"
Source = "https://github.com/psxdata/psxdata-api"
"Bug Tracker" = "https://github.com/psxdata/psxdata-api/issues"

[tool.setuptools.dynamic]
version = {attr = "api.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
